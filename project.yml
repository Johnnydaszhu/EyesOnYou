name: EyesOnYou
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  EyesOnYou:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  EyesOnYou:
    type: application
    platform: macOS
    sources:
      - path: App/EyesOnYou
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.EyesOnYou
        PRODUCT_NAME: EyesOnYou
        INFOPLIST_FILE: App/EyesOnYou/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/EyesOnYou/EyesOnYou.entitlements
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - package: EyesOnYou
        product: EyesOnYouCore
      - package: EyesOnYou
        product: EyesOnYouRuleEngine
      - package: EyesOnYou
        product: EyesOnYouStorage
      - package: EyesOnYou
        product: EyesOnYouIPC
      - package: EyesOnYou
        product: EyesOnYouProxyCore
      - target: EyesOnYouNetworkExtension
        embed: true
        codeSign: true
        # Apple-required: App.app/Contents/Library/SystemExtensions/*.systemextension
        # (wrapper = .app root; must include Contents/ so codesign stays sealed)
        copy:
          destination: wrapper
          subpath: Contents/Library/SystemExtensions
    scheme:
      testTargets: []

  EyesOnYouNetworkExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: NetworkExtension
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.EyesOnYou.NetworkExtension
        PRODUCT_NAME: EyesOnYouNetworkExtension
        INFOPLIST_FILE: NetworkExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: NetworkExtension/EyesOnYouNetworkExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
    dependencies:
      - package: EyesOnYou
        product: EyesOnYouCore
      - package: EyesOnYou
        product: EyesOnYouRuleEngine
      - package: EyesOnYou
        product: EyesOnYouProxyCore
      - package: EyesOnYou
        product: EyesOnYouIPC
      - sdk: NetworkExtension.framework
      - sdk: SystemExtensions.framework
