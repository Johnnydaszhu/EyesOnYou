name: EyesOnYou
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  EyesOnYou:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  EyesOnYou:
    type: application
    platform: macOS
    sources:
      - path: App/EyesOnYou
        excludes:
          - Info.plist
          - "*.entitlements"
    configFiles:
      Debug: config/Signing.xcconfig
    settings:
      base:
        # Real bundle IDs live in gitignored config/Local.xcconfig (see
        # CONTRIBUTING.md: tracked files stay on the com.example placeholder).
        PRODUCT_BUNDLE_IDENTIFIER: "$(EYESONYOU_APP_BUNDLE_ID:default=com.example.EyesOnYou)"
        PRODUCT_NAME: EyesOnYou
        INFOPLIST_FILE: App/EyesOnYou/Info.plist
        # Git-ignored override for signed builds; tracked default is empty so a
        # plain clone needs no provisioning profile. See docs/NE-SIGNING.md.
        CODE_SIGN_ENTITLEMENTS: "$(EYESONYOU_APP_ENTITLEMENTS:default=App/EyesOnYou/EyesOnYou.entitlements)"
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ad-hoc ("-") gives every build a new code identity, so macOS discards
        # Accessibility / app-data grants and re-prompts each time. Export
        # EYESONYOU_CODE_SIGN_IDENTITY="EyesOnYou Dev" (see
        # scripts/dev-signing-identity.sh) to sign with a stable certificate
        # instead and keep permissions across rebuilds.
        CODE_SIGN_IDENTITY: "$(EYESONYOU_CODE_SIGN_IDENTITY:default=-)"
        # Manual: automatic signing demands a development team as soon as the
        # identity is not ad-hoc, which a local self-signed certificate is not.
        # Manual by default so an ad-hoc / self-signed local certificate works
        # with no team. Set EYESONYOU_CODE_SIGN_STYLE = Automatic in the
        # git-ignored config/Local.xcconfig for a real signed build — Xcode then
        # provisions the Network Extension profiles itself.
        CODE_SIGN_STYLE: "$(EYESONYOU_CODE_SIGN_STYLE:default=Manual)"
        # Xcode 16 otherwise splits Debug builds into a stub executable plus
        # EyesOnYou.debug.dylib, and signs the two with different identities —
        # dyld then refuses to load the dylib ("different Team IDs") and the app
        # dies at launch. One binary keeps signing consistent.
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - package: EyesOnYou
        product: EyesOnYouCore
      - package: EyesOnYou
        product: EyesOnYouRuleEngine
      - package: EyesOnYou
        product: EyesOnYouStorage
      - package: EyesOnYou
        product: EyesOnYouIPC
      - package: EyesOnYou
        product: EyesOnYouProxyCore
      - target: EyesOnYouNetworkExtension
        embed: true
        codeSign: true
        # Apple-required: App.app/Contents/Library/SystemExtensions/*.systemextension
        # (wrapper = .app root; must include Contents/ so codesign stays sealed)
        copy:
          destination: wrapper
          subpath: Contents/Library/SystemExtensions
    scheme:
      testTargets: []

  EyesOnYouNetworkExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: NetworkExtension
        excludes:
          - Info.plist
          - "*.entitlements"
    configFiles:
      Debug: config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(EYESONYOU_EXTENSION_BUNDLE_ID:default=com.example.EyesOnYou.NetworkExtension)"
        PRODUCT_NAME: EyesOnYouNetworkExtension
        INFOPLIST_FILE: NetworkExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: "$(EYESONYOU_EXTENSION_ENTITLEMENTS:default=NetworkExtension/EyesOnYouNetworkExtension.entitlements)"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "$(EYESONYOU_CODE_SIGN_IDENTITY:default=-)"
        # Must match the host app's certificate, or embedding fails.
        CODE_SIGN_STYLE: "$(EYESONYOU_CODE_SIGN_STYLE:default=Manual)"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
    dependencies:
      - package: EyesOnYou
        product: EyesOnYouCore
      - package: EyesOnYou
        product: EyesOnYouRuleEngine
      - package: EyesOnYou
        product: EyesOnYouProxyCore
      - package: EyesOnYou
        product: EyesOnYouIPC
      - sdk: NetworkExtension.framework
      - sdk: SystemExtensions.framework
